spring.application.name=NuevaEPS API REST

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nuevaeps_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwtSecret=defaultSecretKeyForDevelopmentOnlyChangeInProduction
app.jwtExpirationMs=86400000

# Logging
logging.level.root=INFO
logging.level.com.nuevaeps.api=DEBUG

# Configuración de logs en archivo
logging.file.name=/app/logs/nuevaeps-backend.log
logging.file.path=/app/logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name}.%d{yyyy-MM-dd}.%i.gz

# Patrón de formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.port=8080
server.servlet.context-path=/
